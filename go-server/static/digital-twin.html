<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Twin Traffic Control v3.5 (Clean Campus)</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0f19;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    header {
      height: 48px;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      gap: 10px;
      z-index: 1000;
    }
    .title-area { display: flex; align-items: center; gap: 8px; }
    .badge {
      background: #059669;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
    }
    .controls { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    button, select {
      background: #1f2937;
      color: #f3f4f6;
      border: 1px solid #374151;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s;
    }
    button:hover, select:hover { background: #374151; }
    button.primary { background: #2563eb; border-color: #3b82f6; }
    button.danger { background: #dc2626; border-color: #ef4444; font-weight: 700; }
    button.warn-btn { background: #d97706; border-color: #f59e0b; font-weight: 700; }
    button.success { background: #059669; border-color: #10b981; font-weight: 700; }
    button.mode-active {
      background: #2563eb;
      border-color: #60a5fa;
      color: #ffffff;
      font-weight: 700;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.5);
    }

    .map-wrapper {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }
    #map { width: 100%; height: 100%; background: #0b0f19; }

    /* OpenStreetMap 反転ダークマップ */
    .osm-dark-tiles { filter: invert(100%) hue-rotate(180deg) brightness(90%) contrast(95%); }

    .mode-banner {
      position: absolute;
      top: 12px;
      left: 52px;
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid #374151;
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 950;
      pointer-events: none;
    }

    .zoom-badge {
      position: absolute;
      bottom: 24px;
      left: 12px;
      background: rgba(17, 24, 39, 0.9);
      border: 1px solid #374151;
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      z-index: 950;
      pointer-events: none;
    }

    .selection-modal {
      display: none;
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.97);
      border: 2px solid #38bdf8;
      border-radius: 10px;
      padding: 14px 20px;
      z-index: 2000;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.85);
      min-width: 360px;
      text-align: center;
    }
    .selection-modal h4 { font-size: 14px; margin-bottom: 6px; color: #f8fafc; }
    .selection-modal p { font-size: 12px; color: #cbd5e1; margin-bottom: 12px; }
    .modal-btns { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header>
    <div class="title-area">
      <strong>Digital Twin Traffic Control</strong>
      <span class="badge">v3.5 Clean Campus</span>
      <span id="locationLabel" style="font-size:12px; color:#9ca3af;">Connecting...</span>
    </div>

    <div class="controls">
      <!-- マップ切り替え -->
      <select id="baseMapSelect" onchange="switchBaseMap(this.value)" title="背景地図切り替え">
        <option value="carto_dark">綺麗なダーク地図</option>
        <option value="osm_dark">OSM反転ダーク</option>
        <option value="carto_light">綺麗な白地図</option>
        <option value="satellite">航空写真</option>
        <option value="gsi">地理院標準</option>
      </select>

      <!-- 編集モード切替 -->
      <button id="btn-mode-view" class="mode-active" onclick="setEditMode('view')">選択</button>
      <button id="btn-mode-node" onclick="setEditMode('node')">+ ノード</button>
      <button id="btn-mode-edge" onclick="setEditMode('edge')">+ エッジ</button>

      <button onclick="fitAllNetwork()">全体表示</button>
      <span>車両: <strong id="vehCountDisplay">--</strong>台</span>
      <button onclick="sendCommand({ action: 'set_vehicle_count', delta: -10 })">-10</button>
      <button onclick="sendCommand({ action: 'set_vehicle_count', delta: 10 })">+10</button>
      <button class="primary" id="toggleBtn" onclick="sendCommand({ action: 'toggle_pause' })">一時停止</button>
      <button class="success" onclick="exportColabJSON()" title="Google Colab用JSON保存">Colab保存</button>
      <button class="danger" onclick="if(confirm('地図を初期状態にリセットしますか？')) sendCommand({ action: 'reset_map' })">リセット</button>
    </div>
  </header>

  <div class="map-wrapper">
    <div id="map"></div>

    <div class="mode-banner" id="modeBanner">
      <strong>操作:</strong> <code>Ctrl + マウスドラッグ</code> で範囲選択（白枠ハイライト → 一括通行止め / 削除）
    </div>
    <div class="zoom-badge" id="zoomBadge">Zoom: 17 / 28</div>

    <div class="selection-modal" id="selectionModal">
      <h4>選択中の要素を操作</h4>
      <p id="selectionModalText">選択範囲内に 0 本の道路と 0 個のノードが含まれています。</p>
      <div class="modal-btns">
        <button class="warn-btn" onclick="applyAreaAction('block')">通行止め</button>
        <button class="success" onclick="applyAreaAction('unblock')">通行止め解除</button>
        <button class="danger" onclick="applyAreaAction('delete')">削除</button>
        <button onclick="closeSelectionModal()">選択解除</button>
      </div>
    </div>
  </div>

  <script>
    const MAX_MAP_ZOOM = 28;
    let map;
    let baseLayers = {};
    let currentBaseLayer = null;
    let edgeLayerGroup, highlightLayerGroup, nodeLayerGroup, vehicleLayerGroup, selectionLayerGroup;
    let latestState = null;
    let lastMapRevision = -1;
    let mapInitialized = false;

    let editMode = "view"; // "view" | "node" | "edge"
    let edgeStartNodeId = null;

    let selectedTarget = null;
    let areaDragStart = null;
    let areaRectLayer = null;
    let selectedAreaItems = { nodeIds: [], edgeIds: [] };

    function initMap() {
      map = L.map("map", {
        zoomControl: true,
        minZoom: 1,
        maxZoom: MAX_MAP_ZOOM,
        zoomSnap: 0.5,
        zoomDelta: 1,
        wheelPxPerZoomLevel: 50,
        boxZoom: false
      }).setView([35.690448, 139.327177], 17);

      // 綺麗な背景地図レイヤー群
      baseLayers = {
        carto_dark: L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
          minZoom: 1, maxZoom: MAX_MAP_ZOOM, maxNativeZoom: 19, attribution: "&copy; CARTO"
        }),
        osm_dark: L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          minZoom: 1, maxZoom: MAX_MAP_ZOOM, maxNativeZoom: 19, className: "osm-dark-tiles", attribution: "&copy; OpenStreetMap"
        }),
        carto_light: L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
          minZoom: 1, maxZoom: MAX_MAP_ZOOM, maxNativeZoom: 19, attribution: "&copy; CARTO"
        }),
        satellite: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
          minZoom: 1, maxZoom: MAX_MAP_ZOOM, maxNativeZoom: 18, attribution: "&copy; Esri"
        }),
        gsi: L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png", {
          minZoom: 1, maxZoom: MAX_MAP_ZOOM, maxNativeZoom: 18, attribution: "&copy; 国土地理院"
        })
      };

      currentBaseLayer = baseLayers.carto_dark.addTo(map);

      edgeLayerGroup = L.layerGroup().addTo(map);
      highlightLayerGroup = L.layerGroup().addTo(map);
      nodeLayerGroup = L.layerGroup().addTo(map);
      vehicleLayerGroup = L.layerGroup().addTo(map);
      selectionLayerGroup = L.layerGroup().addTo(map);

      map.on("zoomend", () => {
        document.getElementById("zoomBadge").textContent = `Zoom: ${map.getZoom()} / ${MAX_MAP_ZOOM}`;
        if (latestState) {
          renderNetwork(latestState);
          renderVehicles(latestState.vehicles);
        }
      });

      map.on("click", (e) => {
        if (e.originalEvent && e.originalEvent.ctrlKey) return;

        // ノード追加モード時
        if (editMode === "node") {
          sendCommand({
            action: "add_node",
            lat: e.latlng.lat,
            lon: e.latlng.lng
          });
          return;
        }

        selectedTarget = null;
        edgeStartNodeId = null;
        renderSelectionHighlights();
      });

      // Ctrl + マウスドラッグで範囲選択
      map.on("mousedown", (e) => {
        const isCtrlDrag = e.originalEvent && (e.originalEvent.ctrlKey || e.originalEvent.metaKey);
        if (!isCtrlDrag) return;

        L.DomEvent.stopPropagation(e);
        L.DomEvent.preventDefault(e.originalEvent);
        map.dragging.disable();
        areaDragStart = e.latlng;
        selectionLayerGroup.clearLayers();
        selectedAreaItems = { nodeIds: [], edgeIds: [] };
        renderSelectionHighlights();

        areaRectLayer = L.rectangle([areaDragStart, areaDragStart], {
          color: "#ffffff",
          weight: 2,
          dashArray: "5, 5",
          fillColor: "#38bdf8",
          fillOpacity: 0.22
        }).addTo(selectionLayerGroup);
      });

      map.on("mousemove", (e) => {
        if (areaDragStart && areaRectLayer) {
          const bounds = L.latLngBounds(areaDragStart, e.latlng);
          areaRectLayer.setBounds(bounds);
          computeAreaItems(bounds);
          renderSelectionHighlights();
        }
      });

      window.addEventListener("mouseup", () => {
        if (!areaDragStart) return;
        map.dragging.enable();
        const bounds = areaRectLayer.getBounds();
        areaDragStart = null;
        openAreaSelectionModal(bounds);
      });
    }

    function switchBaseMap(key) {
      if (currentBaseLayer) map.removeLayer(currentBaseLayer);
      currentBaseLayer = baseLayers[key].addTo(map);
    }

    function setEditMode(mode) {
      editMode = mode;
      edgeStartNodeId = null;
      ["view", "node", "edge"].forEach(m => {
        document.getElementById("btn-mode-" + m).classList.toggle("mode-active", m === mode);
      });

      const banner = document.getElementById("modeBanner");
      if (mode === "view") {
        banner.innerHTML = `<strong>操作:</strong> <code>Ctrl + マウスドラッグ</code> で範囲選択（白枠ハイライト → 一括通行止め / 削除）`;
        document.getElementById("map").style.cursor = "";
      } else if (mode === "node") {
        banner.innerHTML = `<strong>ノード追加モード:</strong> 地図上の好きな場所をクリックすると新しい交差点ノードを追加します`;
        document.getElementById("map").style.cursor = "crosshair";
      } else if (mode === "edge") {
        banner.innerHTML = `<strong>エッジ追加モード:</strong> 始点ノード → 終点ノードの順にクリックして道路を接続します`;
        document.getElementById("map").style.cursor = "pointer";
      }
      renderSelectionHighlights();
    }

    function fitAllNetwork() {
      if (!latestState || !latestState.nodes) return;
      const coords = Object.values(latestState.nodes).map(n => [n.lat, n.lon]);
      if (coords.length > 0) {
        map.fitBounds(L.latLngBounds(coords), { padding: [35, 35] });
      }
    }

    async function sendCommand(payload) {
      try {
        await fetch("/api/twin/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.error("Command failed:", err);
      }
    }

    function exportColabJSON() {
      if (!latestState) return;
      const exportData = {
        nodes: Object.values(latestState.nodes || {}),
        edges: latestState.edges || []
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "campus_graph_edited.json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function getEdgeCoords(e, state) {
      if (e.geometry && e.geometry.length >= 2) {
        return e.geometry;
      }
      const u = state.nodes[e.u];
      const v = state.nodes[e.v];
      if (!u || !v) return null;
      return [[u.lat, u.lon], [v.lat, v.lon]];
    }

    function computeAreaItems(bounds) {
      if (!latestState) return;
      const nodeIds = [];
      const edgeIds = [];

      Object.values(latestState.nodes || {}).forEach(n => {
        if (bounds.contains([n.lat, n.lon])) nodeIds.push(n.id);
      });

      (latestState.edges || []).forEach(e => {
        const coords = getEdgeCoords(e, latestState);
        if (!coords) return;
        if (coords.some(pt => bounds.contains(pt))) {
          edgeIds.push(e.id);
        }
      });
      selectedAreaItems = { nodeIds, edgeIds };
    }

    function openAreaSelectionModal(bounds) {
      computeAreaItems(bounds);
      renderSelectionHighlights();

      const { nodeIds, edgeIds } = selectedAreaItems;
      if (nodeIds.length === 0 && edgeIds.length === 0) {
        selectionLayerGroup.clearLayers();
        return;
      }

      document.getElementById("selectionModalText").textContent =
        `選択範囲内の ${edgeIds.length} 本の道路と ${nodeIds.length} 個のノードを白枠で強調表示しています。`;
      document.getElementById("selectionModal").style.display = "block";
    }

    function applyAreaAction(subAction) {
      sendCommand({
        action: "area_action",
        subAction,
        nodeIds: selectedAreaItems.nodeIds,
        edgeIds: selectedAreaItems.edgeIds
      });
      closeSelectionModal();
    }

    function closeSelectionModal() {
      document.getElementById("selectionModal").style.display = "none";
      selectionLayerGroup.clearLayers();
      selectedAreaItems = { nodeIds: [], edgeIds: [] };
      renderSelectionHighlights();
    }

    function getZoomScale() {
      const z = map ? map.getZoom() : 17;
      if (z <= 15) return 0.8;
      if (z <= 18) return 1.0;
      if (z <= 22) return 1.3;
      return 1.6;
    }

    function renderSelectionHighlights() {
      highlightLayerGroup.clearLayers();
      if (!latestState || !latestState.nodes) return;

      const scale = getZoomScale();
      const highlightEdgeSet = new Set(selectedAreaItems.edgeIds);
      const highlightNodeSet = new Set(selectedAreaItems.nodeIds);

      if (selectedTarget) {
        if (selectedTarget.type === "edge") highlightEdgeSet.add(selectedTarget.id);
        if (selectedTarget.type === "node") highlightNodeSet.add(selectedTarget.id);
      }
      if (edgeStartNodeId) {
        highlightNodeSet.add(edgeStartNodeId);
      }

      (latestState.edges || []).forEach(e => {
        if (!highlightEdgeSet.has(e.id)) return;
        const coords = getEdgeCoords(e, latestState);
        if (!coords) return;

        L.polyline(coords, {
          color: "#ffffff",
          weight: 10 * scale,
          opacity: 0.9,
          interactive: false
        }).addTo(highlightLayerGroup);

        L.polyline(coords, {
          color: "#38bdf8",
          weight: 5 * scale,
          opacity: 1,
          interactive: false
        }).addTo(highlightLayerGroup);
      });

      highlightNodeSet.forEach(nodeId => {
        const n = latestState.nodes[nodeId];
        if (!n) return;
        L.circleMarker([n.lat, n.lon], {
          radius: 9 * scale,
          color: "#ffffff",
          weight: 2.5,
          fillColor: edgeStartNodeId === nodeId ? "#f59e0b" : "#38bdf8",
          fillOpacity: 0.75,
          interactive: false
        }).addTo(highlightLayerGroup);
      });
    }

    function renderNetwork(state) {
      edgeLayerGroup.clearLayers();
      nodeLayerGroup.clearLayers();
      const scale = getZoomScale();

      (state.edges || []).forEach(e => {
        const coords = getEdgeCoords(e, state);
        if (!coords) return;

        const isBlocked = e.blocked;
        const line = L.polyline(coords, {
          color: isBlocked ? "#ef4444" : (e.color || "#38bdf8"),
          weight: (isBlocked ? 5 : 3.5) * scale,
          opacity: isBlocked ? 0.95 : 0.85,
          dashArray: isBlocked ? "6, 8" : null
        });

        line.on("click", (ev) => {
          if (ev.originalEvent && ev.originalEvent.ctrlKey) return;
          if (editMode === "node") return;
          L.DomEvent.stopPropagation(ev);
          selectedTarget = { type: "edge", id: e.id };
          selectedAreaItems = { nodeIds: [], edgeIds: [e.id] };
          renderSelectionHighlights();
          document.getElementById("selectionModalText").textContent =
            `道路 #${e.id} (${e.name || "道路"}) を選択中です。`;
          document.getElementById("selectionModal").style.display = "block";
        });
        line.addTo(edgeLayerGroup);
      });

      Object.values(state.nodes || {}).forEach(n => {
        const marker = L.circleMarker([n.lat, n.lon], {
          radius: 4.0 * scale,
          color: "#0f172a",
          weight: 1.5,
          fillColor: n.color || "#38bdf8",
          fillOpacity: 0.95
        });

        marker.on("click", (ev) => {
          if (ev.originalEvent && ev.originalEvent.ctrlKey) return;
          L.DomEvent.stopPropagation(ev);

          // エッジ追加モード時（始点 → 終点の2クリックで接続）
          if (editMode === "edge") {
            if (!edgeStartNodeId) {
              edgeStartNodeId = n.id;
              renderSelectionHighlights();
              document.getElementById("modeBanner").innerHTML =
                `<strong>エッジ追加モード:</strong> 始点 (<code>${n.id}</code>) を選択中 → 接続先の終点ノードをクリック`;
            } else if (edgeStartNodeId !== n.id) {
              sendCommand({
                action: "add_edge",
                from: edgeStartNodeId,
                to: n.id
              });
              edgeStartNodeId = null;
              renderSelectionHighlights();
              document.getElementById("modeBanner").innerHTML =
                `<strong>エッジ追加完了:</strong> 続けて始点ノードを選択できます`;
            }
            return;
          }

          selectedTarget = { type: "node", id: n.id };
          selectedAreaItems = { nodeIds: [n.id], edgeIds: [] };
          renderSelectionHighlights();
          document.getElementById("selectionModalText").textContent =
            `ノード ${n.id} を選択中です。`;
          document.getElementById("selectionModal").style.display = "block";
        });

        marker.addTo(nodeLayerGroup);
      });

      renderSelectionHighlights();
    }

    function renderVehicles(vehicles) {
      vehicleLayerGroup.clearLayers();
      const scale = getZoomScale();
      (vehicles || []).forEach(v => {
        L.circleMarker([v.lat, v.lon], {
          radius: 4.5 * scale,
          color: "#ffffff",
          weight: 1.2,
          fillColor: v.statusColor || "#22c55e",
          fillOpacity: 1
        }).bindTooltip(`車両 #${v.id}: ${v.speedKmh.toFixed(1)} km/h`).addTo(vehicleLayerGroup);
      });
    }

    function updateUI(state) {
      document.getElementById("locationLabel").textContent =
        `Nodes: ${Object.keys(state.nodes || {}).length} / Edges: ${(state.edges || []).length}`;
      document.getElementById("vehCountDisplay").textContent = (state.vehicles || []).length;

      const toggleBtn = document.getElementById("toggleBtn");
      toggleBtn.textContent = state.isRunning ? "一時停止" : "再開";
      toggleBtn.className = state.isRunning ? "primary" : "success";
    }

    async function pollServerState() {
      try {
        const res = await fetch("/api/twin/state");
        if (res.ok) {
          const state = await res.json();
          latestState = state;

          if (!mapInitialized && state.nodes && Object.keys(state.nodes).length > 0) {
            fitAllNetwork();
            mapInitialized = true;
          }

          if (state.mapRevision !== lastMapRevision) {
            renderNetwork(state);
            lastMapRevision = state.mapRevision;
          }

          renderVehicles(state.vehicles);
          updateUI(state);
        }
      } catch (e) {
        document.getElementById("locationLabel").textContent = "Reconnecting...";
      }
      setTimeout(pollServerState, 50);
    }

    window.addEventListener("DOMContentLoaded", () => {
      initMap();
      pollServerState();
    });
  </script>
</body>
</html>
