<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>大学祭 車両誘導管制シミュレーター</title>
  <style>
    body { font-family: sans-serif; background: #1e293b; color: #f8fafc; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
    .top-bar { display: flex; gap: 15px; align-items: center; margin-bottom: 10px; }
    input { padding: 8px 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1rem; }
    .hud { display: flex; gap: 25px; background: #0f172a; padding: 12px 25px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #334155; }
    .stat { font-size: 1.1rem; font-weight: bold; }
    .danger { color: #ef4444; }
    canvas { background: #0f172a; border: 2px solid #475569; border-radius: 8px; }
    .control-panel { display: flex; gap: 20px; margin-top: 15px; background: #0f172a; padding: 20px; border-radius: 10px; width: 700px; justify-content: space-between; align-items: center; }
    .car-info { background: #1e293b; padding: 15px; border-radius: 8px; border-left: 5px solid #38bdf8; min-width: 260px; line-height: 1.6; }
    .buttons { display: flex; flex-direction: column; gap: 8px; }
    button { padding: 10px 18px; font-size: 0.95rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .btn-a { background: #3b82f6; color: white; }
    .btn-b { background: #10b981; color: white; }
    .btn-reject { background: #ef4444; color: white; }
    .btn-rank { background: #f59e0b; color: #0f172a; }
    button:hover { opacity: 0.85; }
    #log { margin-top: 10px; color: #fbbf24; font-weight: bold; height: 24px; }
  </style>
</head>
<body>

  <h2>🎓 大学祭 交通管制シミュレーター (操作画面)</h2>

  <div class="top-bar">
    <label>担当者名: <input type="text" id="playerName" value="誘導スタッフA" maxlength="15"></label>
    <button class="btn-rank" onclick="dispatch('SUBMIT_RANK')">🏆 記録をランキングに登録してリセット</button>
    <a href="/dashboard.html" target="_blank" style="color:#38bdf8; font-size:0.9rem;">📊 監視ダッシュボードを別タブで開く</a>
  </div>

  <div class="hud">
    <div class="stat">スコア: <span id="score">0</span> pt</div>
    <div class="stat">周辺渋滞度: <span id="congestion">10</span>%</div>
    <div class="stat">A駐車場(申請済): <span id="cap-a">0/5</span></div>
    <div class="stat">B駐車場(一般/搬入): <span id="cap-b">0/8</span></div>
  </div>

  <canvas id="mapCanvas" width="740" height="340"></canvas>
  <div id="log">車両がゲートに到着しました。誘導先を選択してください。</div>

  <div class="control-panel">
    <div class="car-info" id="car-info">読み込み中...</div>
    <div class="buttons">
      <button class="btn-a" onclick="dispatch('PARK_A')">A駐車場へ誘導 (申請済・普通車のみ)</button>
      <button class="btn-b" onclick="dispatch('PARK_B')">B駐車場へ誘導 (一般・大型トラック可)</button>
      <button class="btn-reject" onclick="dispatch('REJECT')">入構拒否 (未申請車両を追い返す)</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    let mapData = null;
    let activeRoute = null;

    async function init() {
      const mapRes = await fetch('/api/map');
      mapData = await mapRes.json();
      const stateRes = await fetch('/api/state');
      const state = await stateRes.json();
      updateUI(state);
      drawMap();
    }

    async function dispatch(action) {
      const playerName = document.getElementById('playerName').value || "GUEST";
      const res = await fetch('/api/dispatch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action, player_name: playerName })
      });
      const data = await res.json();
      document.getElementById('log').innerText = data.message;
      
      activeRoute = (data.route && data.route.coords) ? data.route.coords : null;
      updateUI(data.state);
      drawMap();

      if (data.state.congestion >= 100) {
        alert(`ゲームオーバー！周辺道路が大渋滞で麻痺しました。\n最終スコア: ${data.state.score} pt`);
        dispatch('SUBMIT_RANK');
      }
    }

    function updateUI(state) {
      document.getElementById('score').innerText = state.score;
      const congEl = document.getElementById('congestion');
      congEl.innerText = state.congestion;
      congEl.className = state.congestion >= 70 ? 'danger' : '';

      document.getElementById('cap-a').innerText = `${state.parkings.PARK_A.occupied}/${state.parkings.PARK_A.capacity}`;
      document.getElementById('cap-b').innerText = `${state.parkings.PARK_B.occupied}/${state.parkings.PARK_B.capacity}`;

      const car = state.current_car;
      if (car) {
        const badge = car.is_applied 
          ? '<span style="color:#4ade80;">[事前申請済]</span>' 
          : '<span style="color:#f87171;">[未申請！]</span>';
        const typeLabel = car.vehicle_type === 'TRUCK' ? '🚚 大型搬入トラック' : '🚗 一般乗用車';
        document.getElementById('car-info').innerHTML = `
          <div><strong>到着ゲート:</strong> ${car.entry_gate}</div>
          <div><strong>ナンバー:</strong> ${car.plate}</div>
          <div><strong>車種:</strong> ${typeLabel}</div>
          <div><strong>申請状況:</strong> ${badge}</div>
        `;
      }
    }

    function drawMap() {
      if (!mapData) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      mapData.edges.forEach(edge => {
        const from = mapData.nodes[edge.from];
        const to = mapData.nodes[edge.to];
        ctx.beginPath();
        ctx.moveTo(from.x, from.y);
        ctx.lineTo(to.x, to.y);
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 6;
        ctx.stroke();
      });

      if (activeRoute && activeRoute.length > 1) {
        ctx.beginPath();
        ctx.moveTo(activeRoute[0].x, activeRoute[0].y);
        for (let i = 1; i < activeRoute.length; i++) {
          ctx.lineTo(activeRoute[i].x, activeRoute[i].y);
        }
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 8;
        ctx.stroke();
      }

      for (const [name, node] of Object.entries(mapData.nodes)) {
        ctx.beginPath();
        ctx.arc(node.x, node.y, 18, 0, Math.PI * 2);
        ctx.fillStyle = node.type === 'parking' ? '#10b981' : (node.type === 'gate' ? '#f59e0b' : '#64748b');
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = '12px sans-serif';
        ctx.fillText(name, node.x - 30, node.y - 25);
      }
    }

    setInterval(async () => {
      const res = await fetch('/api/state');
      const state = await res.json();
      updateUI(state);
    }, 3000);

    init();
  </script>
</body>
</html>
